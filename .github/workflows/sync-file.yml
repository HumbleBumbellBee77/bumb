name: Auto Sync Raw File

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and clean HTML content
        run: |
          # 1. Download raw HTML from upstream
          curl -sSL "https://raw.githubusercontent.com/aplsmalab-svg/4535m3n/main/zqscdrtkju34okvbfdehmksbgtsbhushjwon12.html" -o "qscdrtkju34okvbfdehmksbgtsbhushjwon12.html"

          # 2. Remove the access denied div block completely
          sed -i '/<!-- Pesan jika dibuka tanpa token -->/,/<\/div>/d' qscdrtkju34okvbfdehmksbgtsbhushjwon12.html

          # 3. Force mainContainer to always display directly instead of style="display: none;"
          sed -i 's/id="mainContainer" style="display: none;"/id="mainContainer" style="display: block;"/g' qscdrtkju34okvbfdehmksbgtsbhushjwon12.html

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qscdrtkju34okvbfdehmksbgtsbhushjwon12.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync HTML and strip token protection" && git push)
