name: Auto Sync Raw File

on:
  schedule:
    # Runs every hour (adjust cron as needed, e.g., '*/15 * * * *' for every 15 minutes)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual triggering anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest raw file from source
        run: |
          curl -sSL "https://raw.githubusercontent.com/aplsmalab-svg/4535m3n/main/zqscdrtkju34okvbfdehmksbgtsbhushjwon12.html" -o "qscdrtkju34okvbfdehmksbgtsbhushjwon12.html"

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qscdrtkju34okvbfdehmksbgtsbhushjwon12.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update HTML from source" && git push)
