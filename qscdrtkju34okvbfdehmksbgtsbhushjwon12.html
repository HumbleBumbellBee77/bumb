<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asesmen SMALAB</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    body {
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: #f4f6f8;
      min-height: 100vh;
    }

    /* FULLSCREEN OVERLAY PROMPT */
    #fullscreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
    }

    #fullscreenOverlay button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* TOP NAVIGATION BAR */
    .navbar {
      background: #1e293b;
      display: flex;
      justify-content: space-around;
      padding: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-item {
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .nav-item.active {
      background: #2563eb;
      color: #ffffff;
    }

    /* TAB CONTENT PANELS */
    .tab-content {
      display: none;
      padding: 20px 16px;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HOME TAB STYLES */
    .home-title {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      margin-top: 10px;
      text-align: center;
    }

    .home-sub {
      font-size: 13px;
      color: #3b82f6;
      margin-top: 4px;
      margin-bottom: 20px;
      text-align: center;
    }

    .home-img {
      max-width: 85%;
      height: auto;
      border-radius: 10px;
    }

    .home-footer {
      font-size: 14px;
      color: #64748b;
      margin-top: 15px;
    }

    /* CONTAINER DYNAMIC FETCH & RAW STYLES */
    .dynamic-content {
      width: 100%;
    }

    .loading-state {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 14px;
    }

    /* FIX STYLES UNTUK ELEMENT DARI GITHUB RAW */
    .container {
      width: 100%;
      padding: 0;
    }

    .container h2 {
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
      text-align: center;
      margin-bottom: 8px;
    }

    .container h4 {
      font-size: 14px;
      color: #334155;
      margin-bottom: 15px;
      text-align: center;
      font-weight: normal;
    }

    .datetime {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 14px;
      color: #1e293b;
      line-height: 1.4;
      cursor: pointer;
    }

    .jadwal {
      margin-bottom: 10px;
      border-radius: 10px;
      overflow: hidden;
    }

    .label {
      background: #2563eb;
      color: white;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 10px;
      text-align: center;
    }

    .content {
      display: none;
      background: #ffffff;
      padding: 10px;
      border-radius: 0 0 10px 10px;
      margin-top: -4px;
    }

    .btn {
      display: block;
      width: 95%;
      margin: 5px auto;
      padding: 12px;
      text-align: center;
      background: #22c55e;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- OVERLAY UNTUK MEMAKSA FULLSCREEN -->
  <div id="fullscreenOverlay">
    <h2>Mode Ujian Diharuskan</h2>
    <p style="margin-top: 10px; font-size: 14px; color: #cbd5e1;">Anda harus masuk ke mode layar penuh untuk mengakses soal.</p>
    <button onclick="enterFullscreen()">Masuk Layar Penuh</button>
  </div>

  <div class="app-container">

    <!-- NAVIGATION TAB -->
    <nav class="navbar">
      <div class="nav-item" onclick="switchTab('home', this)">Home</div>
      <div class="nav-item" onclick="switchTab('kelas10', this)">Kelas X</div>
      <div class="nav-item" onclick="switchTab('kelas11', this)">Kelas XI</div>
      <div class="nav-item active" onclick="switchTab('kelas12', this)">Kelas XII</div>
    </nav>

    <!-- TAB 1: HOME -->
    <div id="home" class="tab-content">
      <div class="home-title">SMA KRISTEN SATYA WACANA</div>
      <div class="home-sub">Leader - Explorer - Achiever - Disciple</div>
      <img src="asesemen.png" alt="Asesmen" class="home-img" onerror="this.src='https://pkpbssejati-svg.github.io/PkPBsSejati-svg/asesmen.png'">
      <div class="home-footer">n03g</div>
    </div>

    <!-- TAB 2: KELAS X -->
    <div id="kelas10" class="tab-content">
      <div id="fetch-kelas10" class="dynamic-content">
        <div class="loading-state">Memuat data soal...</div>
      </div>
    </div>

    <!-- TAB 3: KELAS XI -->
    <div id="kelas11" class="tab-content">
      <div id="fetch-kelas11" class="dynamic-content">
        <div class="loading-state">Memuat data soal...</div>
      </div>
    </div>

    <!-- TAB 4: KELAS XII -->
    <div id="kelas12" class="tab-content active">
      <div id="fetch-kelas12" class="dynamic-content">
        <div class="loading-state">Memuat data soal...</div>
      </div>
    </div>

  </div>

  <script>
    const GITHUB_RAW_URL = "https://raw.githubusercontent.com/aplsmalab-svg/4535m3n/main/qscdrtkju34okvbfdehmksbgtsbhushjwon12.html";

    let isSecretUnlocked = false;

    // Auto-Fetch & Auto-Sync Konten dari GitHub
    async function syncContentFromGitHub() {
      try {
        const response = await fetch(GITHUB_RAW_URL + "?t=" + new Date().getTime());
        const htmlText = await response.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        const containerContent = doc.querySelector('.container');

        if (containerContent) {
          document.getElementById('fetch-kelas12').innerHTML = containerContent.outerHTML;

          // Attach secret tap exit pada tanggal/jam
          const dtElement = document.getElementById('fetch-kelas12').querySelector('.datetime');
          if (dtElement) {
            dtElement.addEventListener('click', handleSecretTap);
          }

          // Ekstrak dan jalankan script toggle & timer bawaan GitHub
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
        }
      } catch (err) {
        console.error("Gagal sinkronisasi dari GitHub:", err);
      }
    }

    // Force Fullscreen Handler
    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    // Deteksi keluar Fullscreen
    document.addEventListener('fullscreenchange', exitHandler);
    document.addEventListener('webkitfullscreenchange', exitHandler);

    function exitHandler() {
      if (!document.fullscreenElement && !document.webkitIsFullScreen) {
        if (!isSecretUnlocked) {
          document.getElementById('fullscreenOverlay').style.display = 'flex';
        }
      } else {
        document.getElementById('fullscreenOverlay').style.display = 'none';
      }
    }

    // SECRET EXIT FEATURE (Tap Teks Jam 5x)
    let tapCount = 0;
    let tapTimer = null;

    function handleSecretTap() {
      tapCount++;
      clearTimeout(tapTimer);

      if (tapCount >= 5) {
        isSecretUnlocked = true;
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        tapCount = 0;
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
      }
    }

    // Tab Switching Logic
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    // Jalankan Sinkronisasi saat halaman dimuat
    window.addEventListener('DOMContentLoaded', syncContentFromGitHub);

    // Nonaktifkan Klik Kanan
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
