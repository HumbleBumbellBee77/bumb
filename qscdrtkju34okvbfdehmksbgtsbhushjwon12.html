<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menu Soal - Asesmen Kelas XII</title>

  <meta name="robots" content="noindex, nofollow, noarchive">

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --btn-bg: #16a34a;
      --btn-hover: #15803d;
      --border-radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* FULLSCREEN OVERLAY PROMPT */
    #fullscreenOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090d16;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }

    #fullscreenOverlay h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    #fullscreenOverlay p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    #fullscreenOverlay button {
      margin-top: 24px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #fullscreenOverlay button:hover {
      background: var(--primary-hover);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .header-card h2 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .running-text-container {
      background: #eff6ff;
      border-radius: 8px;
      padding: 6px 12px;
      margin: 12px 0;
    }

    .running-text h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .datetime {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1.4;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .datetime:active {
      background: #e2e8f0;
    }

    /* ACCORDION JADWAL */
    .jadwal {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .label {
      background: var(--primary-color);
      color: white;
      padding: 14px 18px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s ease;
    }

    .label:hover {
      background: var(--primary-hover);
    }

    .label::after {
      content: '▼';
      font-size: 0.75rem;
      transition: transform 0.3s ease;
    }

    .jadwal.active .label::after {
      transform: rotate(180deg);
    }

    .content {
      display: none;
      padding: 12px;
      flex-direction: column;
      gap: 8px;
      background: var(--card-bg);
      border-top: 1px solid #e2e8f0;
    }

    .jadwal.active .content {
      display: flex;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 14px;
      text-align: center;
      background: var(--btn-bg);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* EMBEDDED EXAM MODAL / IFRAME */
    #examModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 10000;
      flex-direction: column;
    }

    #examHeader {
      height: 50px;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    #examHeader span {
      font-size: 0.9rem;
      font-weight: 600;
    }

    #closeExamBtn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    #examIframe {
      width: 100%;
      height: calc(100vh - 50px);
      border: none;
    }
  </style>
</head>

<body oncontextmenu="return false;">

  <!-- OVERLAY UNTUK MEMAKSA FULLSCREEN -->
  <div id="fullscreenOverlay">
    <h2>Mode Ujian Diharuskan</h2>
    <p>Anda harus masuk ke mode layar penuh untuk mengakses soal.</p>
    <button onclick="enterFullscreen()">Masuk Layar Penuh</button>
  </div>

  <!-- EMBEDDED EXAM CONTAINER (KEPT INSIDE THE WEBSITE) -->
  <div id="examModal">
    <div id="examHeader">
      <span>Lembar Soal Asesmen</span>
      <button id="closeExamBtn" onclick="closeExam()">Tutup Soal</button>
    </div>
    <iframe id="examIframe" src="about:blank"></iframe>
  </div>

  <div class="container" id="mainContainer">
    <div class="header-card">
      <h2>ASESMEN KELAS XII</h2>
      
      <div class="running-text-container">
        <marquee class="running-text" behavior="scroll" direction="left" scrollamount="5">
          <h4>Takut akan TUHAN adalah permulaan pengetahuan</h4>
        </marquee>
      </div>

      <div class="datetime" id="datetime" onclick="handleSecretTap()"></div>
    </div>

    <!-- JAM KE-1 -->
    <div class="jadwal">
      <div class="label" onclick="toggle(this)">UJI COBA LAB EXAM</div>
      <div class="content">
        <button onclick="openExam('https://docs.google.com/forms/d/e/1FAIpQLSfmDjlDr2cOspzXQ01QsqgH1SKmGRc_x55UpN1RFS2yF8rNJg/viewform?embedded=true')" class="btn">Uji Coba Lab Exam</button>
      </div>
    </div>
            
    <!-- JAM KE-2 -->
    <div class="jadwal">
      <div class="label" onclick="toggle(this)">Jam ke-2</div>
      <div class="content">
        <button onclick="openExam('https://linksoal1c.com')" class="btn" style="display:none;">Paket C</button>
      </div>
    </div>

    <!-- JAM KE-3 -->
    <div class="jadwal">
      <div class="label" onclick="toggle(this)">Jam ke-3</div>
      <div class="content">
        <button onclick="openExam('https://linksoal1c.com')" class="btn" style="display:none;">Paket C</button>
      </div>
    </div>
    
    <!-- UMUM -->
    <div class="jadwal">
      <div class="label" onclick="toggle(this)">UH - REMIDI - Literasi/Numerasi</div>
      <div class="content">
        <button onclick="openExam('https://docs.google.com/forms/d/e/1FAIpQLSdjuSJJbtRl_b0mxGBtRhQerp3IiJ3gDy-qimSeWEKb1LL18g/viewform?embedded=true')" class="btn">Remidi Fisika Listrik Statis</button>         
        <button onclick="openExam('https://docs.google.com/forms/d/e/1FAIpQLSct17dm1s1zMGoSbfNQn6HQUXJQ4ASmWbVDDea_MdvxphrB0A/viewform?embedded=true')" class="btn">AS BAB1 PP</button>
        <button onclick="openExam('https://docs.google.com/forms/d/e/1FAIpQLScZY_EyR8K-T0Ye0eBBe_jgY-7sUbTSzSuLt6JMmJQdMH37Vw/viewform?embedded=true')" class="btn">Pra ASTS-1 Kimia XII-2</button>
        <button onclick="openExam('https://docs.google.com/forms/d/e/1FAIpQLSftFi6AUxclMwRe-HHKf3pJCV6ldwT3XDRAjf0r1Lp9ZhmDbw/viewform?embedded=true')" class="btn">Pra ASTS-1 Kimia XII-3</button> 
      </div>
    </div>
  </div>

<script>
  let isSecretUnlocked = false;

  // Detect iOS / iPhone / iPad
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Force Fullscreen Handler (Supports Android, Desktop, & Fallback for iPhone)
  function enterFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    }
    
    // On iPhone/iOS where standard HTML Fullscreen is unsupported, dismiss overlay manually
    if (isIOS) {
      document.getElementById('fullscreenOverlay').style.display = 'none';
    }
  }

  // Deteksi keluar Fullscreen
  document.addEventListener('fullscreenchange', exitHandler);
  document.addEventListener('webkitfullscreenchange', exitHandler);
  document.addEventListener('msfullscreenchange', exitHandler);

  function exitHandler() {
    // Skip native fullscreen state checks for iOS devices
    if (isIOS) return;

    const isFS = document.fullscreenElement || document.webkitIsFullScreen || document.msFullscreenElement;
    if (!isFS) {
      if (!isSecretUnlocked) {
        document.getElementById('fullscreenOverlay').style.display = 'flex';
      }
    } else {
      document.getElementById('fullscreenOverlay').style.display = 'none';
    }
  }

  // OPEN EXAM INSIDE EMBEDDED IFRAME
  function openExam(url) {
    const modal = document.getElementById('examModal');
    const iframe = document.getElementById('examIframe');
    iframe.src = url;
    modal.style.display = 'flex';
  }

  function closeExam() {
    const modal = document.getElementById('examModal');
    const iframe = document.getElementById('examIframe');
    iframe.src = 'about:blank';
    modal.style.display = 'none';
  }

  // SECRET EXIT FEATURE (Tap Teks Jam 5x)
  let tapCount = 0;
  let tapTimer = null;

  function handleSecretTap() {
    tapCount++;
    clearTimeout(tapTimer);

    if (tapCount >= 5) {
      isSecretUnlocked = true;
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      document.getElementById('fullscreenOverlay').style.display = 'none';
      tapCount = 0;
    } else {
      tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
    }
  }

  // Toggle buka-tutup accordion
  function toggle(el) {
    const parent = el.parentElement;
    parent.classList.toggle('active');
  }

  // Tanggal & jam
  function updateDateTime() {
    const now = new Date();

    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni",
                   "Juli","Agustus","September","Oktober","November","Desember"];

    let h = hari[now.getDay()];
    let tgl = now.getDate();
    let bln = bulan[now.getMonth()];
    let thn = now.getFullYear();

    let jam = now.getHours().toString().padStart(2,'0');
    let menit = now.getMinutes().toString().padStart(2,'0');
    let detik = now.getSeconds().toString().padStart(2,'0');

    document.getElementById("datetime").innerHTML =
      h + ", " + tgl + " " + bln + " " + thn + "<br>" +
      jam + ":" + menit + ":" + detik;
  }

  setInterval(updateDateTime, 1000);
  updateDateTime();

  // Nonaktifkan klik kanan
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });
</script>

</body>
</html>
